<body>

    <div class="container">

        <h1>🎓 Student Result Portal</h1>

        <div class="subtitle">
            Search and view student academic results
        </div>

        <div class="search-box">

            <input
                type="text"
                id="register_number"
                placeholder="Enter Register Number"
            >

            <button onclick="searchResult()">
                Search Result
            </button>

        </div>

        <div id="result"></div>

    </div>

    <script>

        async function searchResult() {

            let registerNumber =
                document.getElementById(
                    "register_number"
                ).value.trim();

            if (registerNumber === "") {

                document.getElementById("result").innerHTML =
                    '<div class="not-found">Please enter a register number.</div>';

                return;
            }

            let response =
                await fetch(
                    "http://127.0.0.1:8000/results"
                );

            let students =
                await response.json();

            let student =
                students.find(
                    student =>
                        student.register_number === registerNumber
                );

            if (student) {

                let output = `
                    <div class="student-card">

                        <h2>${student.student_name}</h2>

                        <p>
                            <strong>Register Number:</strong>
                            ${student.register_number}
                        </p>

                        <p>
                            <strong>Department:</strong>
                            ${student.department}
                        </p>

                        <table>

                            <tr>
                                <th>Subject</th>
                                <th>Grade</th>
                            </tr>
                `;

                student.subjects.forEach(subject => {

                    output += `
                        <tr>
                            <td>${subject.subject_name}</td>
                            <td>${subject.grade}</td>
                        </tr>
                    `;

                });

                output += `
                        </table>
                    </div>
                `;

                document.getElementById("result").innerHTML =
                    output;

            } else {

                document.getElementById("result").innerHTML =
                    '<div class="not-found">Student Not Found</div>';

            }
        }

    </script>

</body>
